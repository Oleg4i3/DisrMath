<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажер: дискретна математика (модуль 1)</title>
<style>
:root{--bg:#eef2f6;--ink:#1b2733;--ac:#0f766e;--ok:#d6f2e4;--bad:#fbd9d9;--ln:#c5d0db}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:900px;margin:0 auto;padding:12px}
section,#start{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:16px;margin:14px 0}
h2{font:600 1.3rem Georgia,serif;margin:0 0 8px}h3{margin:14px 0 6px;font-size:1rem}
button,input,select{font:inherit}button{cursor:pointer}
.b{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:7px 14px}
input[type=text],input[type=number],select{border:1px solid var(--ln);border-radius:6px;padding:5px 8px}
input[type=number]{width:11ch}
.rt table{margin:0}.rt th.v{vertical-align:bottom;padding:6px 2px}.rt th.v span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:600;font-size:.88rem}
.rt td+td{padding:3px 2px}.rt .pm{min-width:30px;height:30px}
.rt th:first-child,.rt td:first-child{position:sticky;left:0;z-index:1;background:#fff;box-shadow:1px 0 0 var(--ln)}.rt th:first-child{vertical-align:bottom}
.k1{display:grid;grid-template-columns:max-content 1fr;gap:28px;align-items:start}.k1 h3{margin-top:0}.k1r{position:sticky;top:8px}
@media(max-width:760px){.k1{grid-template-columns:1fr}.k1r{position:static}}
table{border-collapse:collapse}td,th{border:1px solid var(--ln);padding:3px 8px;text-align:center}
.c0,.pm{min-width:34px;border:1px solid var(--ln);background:#f7f9fb;border-radius:4px}
.km{display:grid;grid-template-columns:repeat(5,52px);gap:2px;width:max-content;margin-bottom:8px}
.hd{display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#567}
.cl{height:52px;display:flex;align-items:center;justify-content:center;border:1px solid var(--ln);cursor:pointer;font-weight:600}
.km.st .cl{cursor:default}
.cl.sel{background:#fff3b0}
.gp{display:inline-block;border:2px solid;border-radius:12px;padding:1px 10px;margin:6px 6px 0 0;cursor:pointer}
.fd{font-size:1.3rem;min-height:2.2rem;border-bottom:2px solid var(--ink);margin:6px 0}
.n{text-decoration:overline}
#kb button{min-width:40px;margin:2px;padding:4px 8px}
.ok{background:var(--ok)!important}.bad{background:var(--bad)!important}
.fb{margin-top:8px}.wrap{overflow-x:auto}
.ln{display:inline-block;margin:4px 14px 4px 0}.ans{color:#a11}
#dr{position:relative;width:360px;max-width:100%;aspect-ratio:360/260;border:1px dashed var(--ln);margin-top:6px}
#dr svg,#dr canvas{position:absolute;inset:0;width:100%;height:100%}#dr canvas{touch-action:none;cursor:crosshair;opacity:.5}.rg{position:absolute;width:48px;height:22px;padding:0 2px;font-size:12px;text-align:center;border:1px dashed #9ab;border-radius:5px;background:rgba(255,255,255,.7)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #888;margin-right:6px}
.done .pm,.done .c0,.done .cl,.done #kb,.done #ag,.done .gp{pointer-events:none}
.hn{margin:10px 0;border:1px dashed #d4a017;border-radius:6px;padding:4px 10px;background:#fffbea}.hs{cursor:pointer;color:#8a6500;font-weight:600}.hb{margin-top:6px}
.hint{color:#567;font-size:.9rem}
.scr{margin-top:8px;padding:4px 8px;border-left:3px solid #4a90e2;background:#f3f7fc}
details summary{cursor:pointer}
</style></head><body>
<main>
<div id="start"><h2>Тренажер: дискретна математика (модуль 1)</h2>
<p>Оберіть теми, які треба повторити. Програма видає по одній задачі; після перевірки показує правильну відповідь і розбір.</p>
<p><button id="mP">Практика</button> <button id="mT">Теорія</button></p>
<div id="tp"></div><p><button class="b" id="new">Нова задача</button> <span class="hint" id="sc"></span></p></div>
<section id="t1"></section><div id="act"></div>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let R=Math.random,done=false,T=null,st={},Q1=null;
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[ri(0,a.length-1)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const rd=x=>Math.round(x*10)/10,bits=(x,n)=>x.toString(2).padStart(n,'0'),pc=x=>{let c=0;while(x){c+=x&1;x>>=1}return c};
const C=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)};
const fact=n=>n<=1?1:n*fact(n-1);
const plural=(n,one,few,many)=>{const a=n%10,b=n%100;return a==1&&b!=11?one:a>=2&&a<=4&&(b<12||b>14)?few:many};
const joinList=a=>a.length==1?a[0]:a.slice(0,-1).join(', ')+' і '+a[a.length-1];
const COL=['#e11d48','#2563eb','#16a34a','#9333ea','#f59e0b','#0891b2','#ea580c','#475569'];
const mk=(e,g)=>e.classList.add(g?'ok':'bad');
const FB=s=>{$('#t1 .fb').innerHTML=s};
const HN=t=>`<details class="hn"><summary class="hs">💡 Підказка</summary><div class="hb">${t}</div></details>`;
const K={};

/* вираз із цілих чисел для відповідей на кшталт 2^5*3^4 (без eval; обмежені степені) */
function pe(s){s=String(s).replace(/[\s_]/g,'').replace(/\*\*/g,'^').replace(/[×·]/g,'*');
 if(!/^[\d+\-*^()]+$/.test(s)||s.length>60)return null;let i=0;
 const E=()=>{let v=Tm();while(s[i]=='+'||s[i]=='-'){const o=s[i++],r=Tm();v=o=='+'?v+r:v-r}return v},
 Tm=()=>{let v=P();while(s[i]=='*'){i++;v*=P()}return v},
 P=()=>{const b=A();if(s[i]=='^'){i++;const e=P();if(e<0n||e>400n)throw 0;if(b>1n&&e*BigInt(b.toString(2).length)>6000n)throw 0;return b**e}return b},
 A=()=>{if(s[i]=='('){i++;const v=E();if(s[i++]!=')')throw 0;return v}const m=/^\d+/.exec(s.slice(i));if(!m||m[0].length>30)throw 0;i+=m[0].length;return BigInt(m[0])};
 try{const v=E();return i==s.length?v:null}catch(e){return null}}

/* універсальна задача з числовими відповідями */
const numTask=(ti,txt,inp,ex,venn,hint)=>({ti,hint,
 html:`<p>${txt}</p>`+inp.map(p=>`<label class="ln">${p[0]} = <input type="number" class="ni"></label>`).join('')+(venn?draft(venn):''),
 init(){if(venn)initDraft()},
 g(){const els=$$('#t1 input.ni');let ok=0;inp.forEach((p,i)=>{const e=els[i],g=e.value!==''&&+e.value===p[1];ok+=g;mk(e,g);if(!g)e.insertAdjacentHTML('afterend',` <b class="ans">(${p[1]})</b>`)});
  FB(ex?'<div class="hint" style="color:#1b2733"><b>Розв’язання.</b> '+ex+'</div>':'');return ok/inp.length}});

/* ================= 1. Булеві функції, карти Карно ================= */
const SEG=["abcdef","bc","abdeg","abcdg","bcfg","acdfg","acdefg","abc","abcdefg","abcdfg","abcefg","cdefg","adef","bcdeg","adefg","aefg"];
const PR=[2,3,5,7,11,13];
const DEC=[["простих чисел",i=>PR.includes(i)],["простих непарних чисел",i=>PR.includes(i)&&i%2],["чисел, кратних трьом",i=>i%3==0],["непарних чисел, кратних трьом",i=>i%3==0&&i%2],["чисел, кратних п’яти",i=>i%5==0],["парних чисел",i=>i%2==0]];
const G7={a:[10,2,40,7],g:[10,46,40,7],d:[10,91,40,7],f:[2,10,7,36],b:[51,10,7,36],e:[2,54,7,36],c:[51,54,7,36]};
const svg7=s=>`<svg viewBox="0 0 60 100" width="54" style="float:right">${Object.entries(G7).map(([k,r])=>`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="2" fill="${k==s?'#e11d48':'#d9dfe6'}"/>`).join('')}</svg>`;
function gen1(){const k=ri(0,12);
 if(k<7){const s="abcdefg"[k];return{seg:s,F:SEG.map(x=>+x.includes(s)),html:`${svg7(s)}<p>Побудуйте мінімальну формулу для керування сегментом індикатора, виділеним червоним на малюнку, що перетворює 4-бітний код (A — старший біт) у цифру або літеру 0–9, A, b, C, d, E, F.</p>`}}
 const[n,f]=DEC[k-7];return{F:[...Array(16).keys()].map(i=>+!!f(i)),html:`<p>Побудуйте мінімальну формулу дешифратора ${n}: на виході 1, якщо 4-бітне число (0000–1111, A — старший біт) таке, і 0 в іншому разі.</p>`}}
const cube=(m,v)=>{let s=0;for(let i=0;i<16;i++)if((i&m)==v)s|=1<<i;return s};
function refm(F,t){const Tm=F.reduce((s,f,i)=>f==t?s|1<<i:s,0),imp=[];
 for(let m=0;m<16;m++)for(let v=0;v<16;v++)if((v&m)==v){const s=cube(m,v);if((s&Tm)==s)imp.push({s,l:pc(m),m,v})}
 const pr=imp.filter(a=>!imp.some(b=>b.s!=a.s&&(a.s&b.s)==a.s));let bc=1e9,covers=[];
 (function rec(i,ch,u,l){const c=l*100+ch.length;if(c>bc)return;if(u==Tm){if(c<bc){bc=c;covers=[ch]}else covers.push(ch);return}
  if(i>=pr.length)return;rec(i+1,[...ch,pr[i].s],u|pr[i].s,l+pr[i].l);rec(i+1,ch,u,l)})(0,[],0,0);
 return{pr,covers,min:Math.floor(bc/100)}}
const gScore=(G,cv)=>{G=[...new Set(G)];let b=0;if(!G.length)return 0;for(const c of cv){const k=G.filter(g=>c.includes(g)).length;b=Math.max(b,(k-(G.length-k))/c.length)}return Math.max(0,b)};
const tokH=t=>t[0]=='!'?`<span class="n">${t[1]}</span>`:t,TK=['A','B','C','D','!A','!B','!C','!D','∨','·','(',')'];
const isEnd=t=>/^!?[A-D]$/.test(t)||t==')',isBeg=t=>/^!?[A-D]$/.test(t)||t=='(';
const nrm=tok=>{const o=[];tok.forEach((t,i)=>{if(i&&isEnd(tok[i-1])&&isBeg(t))o.push('·');o.push(t)});return o};
function fEval(tok,F){tok=nrm(tok);const s=tok.join(''),L='!?[A-D]',f=`(?:${L}|\\(${L}(?:∨${L})*\\))`;
 const dn=new RegExp(`^${L}(·${L})*(∨${L}(·${L})*)*$`),cn=new RegExp(`^${f}(·${f})*$`);let eq=true;
 try{const ex=tok.map(t=>t=='∨'?'||':t=='·'?'&&':t[0]=='!'?`!v[${t.charCodeAt(1)-65}]`:/[A-D]/.test(t)?`v[${t.charCodeAt(0)-65}]`:t).join(' ');
  const fn=new Function('v','return !!('+ex+')');for(let i=0;i<16;i++){const v=[3,2,1,0].map(j=>i>>j&1);if(+fn(v)!=F[i])eq=false}}catch(e){eq=false}
 return{eq,form:{dnf:dn.test(s),cnf:cn.test(s)},lit:tok.filter(t=>/[A-D]/.test(t)).length}}
const lit=(j,n)=>n?`<span class="n">${'ABCD'[j]}</span>`:'ABCD'[j],GR=[0,1,3,2];
function refFormula(r,t){return r.covers[0].map(s=>{const p=r.pr.find(p=>p.s==s),L=[];for(let j=0;j<4;j++){const b=3-j;if(p.m>>b&1){const v=p.v>>b&1;L.push(lit(j,t?!v:!!v))}}return t?L.join('·'):'('+L.join('∨')+')'}).join(t?' ∨ ':' · ')}
const HEX="0123456789AbCdEF";
const glyph=i=>`<svg viewBox="-4 -4 68 108" width="22" style="vertical-align:middle">${Object.entries(G7).map(([k,r])=>`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="2" fill="${SEG[i].includes(k)?'#1b2733':'#e3e8ee'}"/>`).join('')}</svg> <small>${HEX[i]}</small>`;
function draw(){const sg=Q1.seg;let h=`<table><tr><th>A<th>B<th>C<th>D${sg?'<th>Символ':''}<th>F`;
 for(let i=0;i<16;i++)h+=`<tr><td>${[3,2,1,0].map(j=>i>>j&1).join('<td>')}${sg?'<td>'+glyph(i):''}<td><button class="c0" data-i="${i}">${st.tbl[i]??'?'}</button>`;
 $('#tbl').innerHTML=h+'</table>';
 h='<div class="km"><div class="hd">AB＼CD</div>'+GR.map(c=>`<div class="hd">${bits(c,2)}</div>`).join('');
 GR.forEach(r=>{h+=`<div class="hd">${bits(r,2)}</div>`;GR.forEach(c=>{const i=r<<2|c,gs=st.groups.map((g,k)=>g>>i&1?k:-1).filter(k=>k>=0),sh=gs.map((k,n)=>`inset 0 0 0 ${3+3*n}px ${COL[k%8]}`).join(',');
  h+=`<div class="cl${st.sel>>i&1?' sel':''}" data-i="${i}" style="box-shadow:${sh||'none'}">${st.tbl[i]??'·'}</div>`})});
 $('#km').innerHTML=h+'</div>';
 $('#gl').innerHTML=st.groups.map((g,k)=>`<span class="gp" data-k="${k}" style="border-color:${COL[k%8]}">Група ${k+1} ✕</span>`).join('');
 $('#fd').innerHTML='F = '+(st.tok.map(tokH).join(' ')||'…')}
K.kmap=()=>{Q1=gen1();st={tbl:Array(16).fill(null),mode:'dnf',sel:0,groups:[],tok:[]};
 return{ti:'Карти Карно: мінімальна ДНФ/КНФ',
 hint:'Групи на карті Карно — прямокутники з 1, 2, 4, 8 або 16 клітинок; карта «склеєна» по краях. Одна група дає один добуток (для КНФ — одну суму). Беріть якомога більші групи й якомога менше груп. Для КНФ групуйте нулі, а літери беріть із протилежним знаком.',
 html:Q1.html+`<div class="k1"><div class="k1l"><h3>1. Таблиця істинності</h3><p class="hint">Натискайте клітинку F, щоб змінити значення.</p><div id="tbl"></div></div>
<div class="k1r"><h3>2. Карта Карно</h3><p>Форма: <label><input type="radio" name="md" value="dnf" checked> ДНФ (групи з 1)</label> <label><input type="radio" name="md" value="cnf"> КНФ (групи з 0)</label></p>
<p class="hint">Позначте клітинки однієї групи і натисніть «Зафіксувати групу».</p><div id="km"></div><button class="b" id="ag">Зафіксувати групу</button><div id="gl"></div></div></div>
<h3>3. Мінімальна формула</h3><p class="hint">Знак «·» можна не вводити: A B ∨ C означає A·B ∨ C.</p><div id="fd" class="fd"></div><div id="kb"></div>`,
 init(){
  $$('[name=md]').forEach(r=>r.onchange=()=>{st.mode=r.value;st.groups=[];st.sel=0;st.tok=[];draw()});
  $('#tbl').onclick=e=>{const i=e.target.dataset.i;if(i==null||done)return;st.tbl[i]=st.tbl[i]===null?0:1-st.tbl[i];draw()};
  $('#km').onclick=e=>{const i=e.target.dataset.i;if(i==null||done)return;st.sel^=1<<i;draw()};
  $('#ag').onclick=()=>{if(st.sel&&!st.groups.includes(st.sel))st.groups.push(st.sel);st.sel=0;draw()};
  $('#gl').onclick=e=>{const k=e.target.dataset.k;if(k==null||done)return;st.groups.splice(k,1);draw()};
  $('#kb').innerHTML=TK.map(t=>`<button data-t="${t}">${tokH(t)}</button>`).join('')+'<button data-t="<">⌫</button><button data-t="x">Очистити</button>';
  $('#kb').onclick=e=>{const t=e.target.closest('button')?.dataset.t;if(!t||done)return;if(t=='<')st.tok.pop();else if(t=='x')st.tok=[];else st.tok.push(t);draw()};
  draw()},
 g(){const F=Q1.F,t=st.mode=='dnf'?1:0,r=refm(F,t),G=[...new Set(st.groups)];
  let tb=0;$$('#tbl .c0').forEach(b=>{const i=+b.dataset.i,ok=st.tbl[i]===F[i];tb+=ok;b.classList.add(ok?'ok':'bad');if(!ok)b.textContent=`${st.tbl[i]??'?'}→${F[i]}`});
  let Tm=0;F.forEach((f,i)=>{if(f==t)Tm|=1<<i});
  const fe=fEval(st.tok,F),ok=fe.eq&&fe.form[st.mode],nonmin=ok&&fe.lit>r.min,fs=ok?(nonmin?.6:1):fe.eq?.3:0,
   valid=G.length>0&&G.every(g=>(g&Tm)==g)&&G.reduce((u,g)=>u|g,0)==Tm,
   gs=nonmin&&valid?1:gScore(G,r.covers);
  const best=r.covers.reduce((a,c)=>G.filter(g=>c.includes(g)).length>G.filter(g=>a.includes(g)).length?c:a,r.covers[0]),miss=best.filter(c=>!G.includes(c)).length;
  $('#gl').innerHTML=G.map((g,k)=>{const good=r.covers.some(c=>c.includes(g)),pr=r.pr.some(p=>p.s==g);return`<div class="${good?'ok':'bad'}" style="padding:2px 8px;margin-top:4px">Група ${k+1}: ${good?'✓ правильна':pr?'максимальна, але не потрібна в мінімальному покритті':(g&Tm)==g?'коректна, але не максимальна (існує більша група, можливо «розірвана» по краях карти)':'✗ містить клітинки з протилежним значенням'}</div>`}).join('');
  FB(`<div class="${fs==1?'ok':'bad'}" style="padding:6px 10px">${miss?`Пропущено груп: ${miss} (перевірте групи, що «склеюються» по краях карти). `:''}Формула: ${!fe.eq?'не еквівалентна функції':!ok?'еквівалентна, але не має вигляду '+(st.mode=='dnf'?'ДНФ':'КНФ'):fe.lit==r.min?'правильна й мінімальна':'правильна, але не мінімальна'}. Еталон: F = ${refFormula(r,t)}</div>`);
  return(tb/16+gs*2.5+fs*2.5)/6}}};

/* швидка вправа: прості імпліканти і довжина мінімальних форм */
K.minim=()=>{let F,r1,r0;
 for(;;){F=[...Array(16)].map(()=>+(R()<.5));const o=F.reduce((a,b)=>a+b);if(o>=5&&o<=11)break}
 r1=refm(F,1);r0=refm(F,0);const ones=F.map((f,i)=>f?i:-1).filter(i=>i>=0);
 let km='<div class="km st"><div class="hd">AB＼CD</div>'+GR.map(c=>`<div class="hd">${bits(c,2)}</div>`).join('');
 GR.forEach(r=>{km+=`<div class="hd">${bits(r,2)}</div>`;GR.forEach(c=>{km+=`<div class="cl">${F[r<<2|c]}</div>`})});km+='</div>';
 return numTask('Карти Карно: прості імпліканти й довжина форм',
  `Булева функція F(A,B,C,D) задана картою Карно (A — старший біт). Одиниці на наборах з десятковими номерами: ${ones.join(', ')}.`+km+`Скільки літер у кожній формулі? Рахуйте кожне входження літери (з інверсією або без).`,
  [['Кількість простих імплікант ДНФ',r1.pr.length],['Літер у мінімальній ДНФ',r1.min],['Літер у мінімальній КНФ',r0.min]],
  `Мінімальна ДНФ: F = ${refFormula(r1,1)}. Мінімальна КНФ: F = ${refFormula(r0,0)}. Простих імплікант (максимальних груп з одиниць): ${r1.pr.length}.`,
  null,'Проста імпліканта — максимальна група з одиниць, яку не можна розширити. Для КНФ групуйте нулі.')};

/* ================= 2. Відношення та відповідності ================= */

const imp=(a,b)=>!a||b,eqv=(a,b)=>a===b,xr=(a,b)=>a!==b;
const CF=[["p ∧ ¬p",p=>p&&!p],["p ∨ ¬p",p=>p||!p],["p ∨ 1",p=>p||true],["p ∧ 0",p=>p&&false],["p ∨ 0",p=>p||false],["p ∧ 1",p=>p&&true],["p ∧ q",(p,q)=>p&&q],["p ∨ q",(p,q)=>p||q],["1 ∧ ¬0",()=>true&&!false],["0 ∨ ¬1",()=>false||!true],
["p → (q → p)",(p,q)=>imp(p,imp(q,p))],["(p → q) ↔ (¬q → ¬p)",(p,q)=>eqv(imp(p,q),imp(!q,!p))],["p ⊕ p",p=>xr(p,p)],["(p ↔ q) ⊕ (q ↔ p)",(p,q)=>xr(eqv(p,q),eqv(q,p))],["(p → q) ∧ p ∧ ¬q",(p,q)=>imp(p,q)&&p&&!q],["(p ∧ q) → (p ∨ r)",(p,q,r)=>imp(p&&q,p||r)],["p ↔ ¬p",p=>eqv(p,!p)],["((p → q) → p) → p",(p,q)=>imp(imp(imp(p,q),p),p)],["(p ⊕ q) ↔ (p ↔ q)",(p,q)=>eqv(xr(p,q),eqv(p,q))],["(p → q) ∨ (q → p)",(p,q)=>imp(p,q)||imp(q,p)],
["p → q",(p,q)=>imp(p,q)],["p ↔ q",(p,q)=>eqv(p,q)],["p ⊕ q",(p,q)=>xr(p,q)],["(p → q) → q",(p,q)=>imp(imp(p,q),q)],["p ∧ (q ∨ r)",(p,q,r)=>p&&(q||r)],["(p → q) → (q → p)",(p,q)=>imp(imp(p,q),imp(q,p))]];
const cls=f=>{let t=0,fl=0;for(let m=0;m<8;m++){f(!!(m&1),!!(m&2),!!(m&4))?t++:fl++}return fl==0?'T':t==0?'F':'N'};

 row=q=>{let s='';for(let m=0;m<8;m++)s+=q.f(!!(m&4),!!(m&2),!!(m&1))?1:0;return s};

  html:`<p>Для кожної формули оберіть, чим вона є. (Позначення: ¬ — заперечення, ∧ — «і», ∨ — «або», → — імплікація, ↔ — еквівалентність, ⊕ — виключне «або», 0/1 — хиба/істина.)</p>`+Q.map(q=>`<div class="ln"><b>${q.t}</b> <select class="ni"><option value="">—</option>${O.map((o,k)=>`<option value="${k}">${o}</option>`).join('')}</select></div>`).join('<br>'),
  g(){const s=$$('#t1 select');let c=0;s.forEach((e,k)=>{const g=e.value!==''&&+e.value==M[Q[k].c];c+=g;mk(e,g)});
   FB(`<div class="hint" style="color:#1b2733">Значення формул на наборах (p,q,r) = 000, 001, …, 111:<br>${Q.map(q=>`${q.t}: <code>${row(q)}</code> — ${O[M[q.c]]}`).join('<br>')}</div>`);return c/Q.length}}};

const MT={bool:'Булеві функції та карти Карно'};

/* ================= тренажер ================= */
const TOP=[
 {id:'bool',t:'Булеві функції та карти Карно',k:['kmap','minim']},
 {id:'rel',t:'Відношення та відповідності',k:['rel','relcnt']},
 {id:'set',t:'Множини, потужності, діаграми Венна',k:['setcard','venn1','venn2','venn3']},
 {id:'comb',t:'Комбінаторика',k:['c1','c2','c3','c4','c5','c6','c7']},
 {id:'logic',t:'Логіка висловлень',k:['impl','taut']}];
const S={mode:'p',sel:new Set(TOP.map(t=>t.id)),last:null,n:0,sum:0,cur:null,checked:false,queue:[]};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const el=$('#t1'),act=$('#act');
function setAct(){act.innerHTML=S.checked?'<button class="b" id="nx">Наступна →</button>':'<button class="b" id="ck">Перевірити</button> <button id="sk">Пропустити</button>';
 if(S.checked)$('#nx').onclick=next;else{$('#ck').onclick=check;$('#sk').onclick=next}}
function score(){$('#sc').textContent=S.n?`Розв’язано: ${S.n} · середня правильність: ${Math.round(S.sum/S.n*100)}%`:''}
function next(){S.checked=false;done=false;document.body.classList.remove('done');el.onclick=null;
 if(!S.sel.size){el.innerHTML='<p>Оберіть хоча б одну тему.</p>';act.innerHTML='';return}
 if(S.mode=='p'){const ts=TOP.filter(t=>S.sel.has(t.id)),t=rnd(ts),c=t.k.filter(k=>k!=S.last),id=rnd(c.length?c:t.k);S.last=id;
  R=mul((Math.random()*4294967296)>>>0);for(let j=0;j<8;j++)R();
  T=K[id]();el.innerHTML=`<h2>${T.ti}</h2>`+T.html+(T.hint?HN(T.hint):'')+'<div class="fb"></div>';if(T.init)T.init();S.cur=id}
 else{if(!S.queue.length)S.queue=shuf(MC.filter(q=>S.sel.has(q[0])));if(!S.queue.length){el.innerHTML='<p>Для обраних тем немає теоретичних питань.</p>';act.innerHTML='';return}
  const q=S.queue.pop();S.cur={o:shuf(q.slice(2).map((t,k)=>[t,!k]))};
  el.innerHTML=`<h2>Теорія</h2><p><b>${q[1]}</b></p>`+S.cur.o.map(o=>`<label style="display:block;margin:4px 0"><input type="radio" name="mq"> ${o[0]}</label>`).join('')+'<div class="fb"></div>'}
 setAct();scrollTo(0,0)}
function check(){S.checked=true;let f;
 if(S.mode=='p'){f=T.g();done=true;document.body.classList.add('done');$$('#t1 input,#t1 select').forEach(e=>e.disabled=true)}
 else{const rs=$$('#t1 [name=mq]');f=0;rs.forEach((r,j)=>{const g=S.cur.o[j][1];if(g)r.parentNode.classList.add('ok');else if(r.checked)r.parentNode.classList.add('bad');if(g&&r.checked)f=1;r.disabled=true});
  $('#t1 .fb').innerHTML=f?'<div class="ok" style="padding:4px 8px">Правильно.</div>':'<div class="bad" style="padding:4px 8px">Неправильно. Правильна відповідь виділена зеленим.</div>'}
 el.insertAdjacentHTML('beforeend',`<div class="scr"><b>Правильність: ${Math.round(f*100)}%</b></div>`);S.n++;S.sum+=f;score();setAct()}
function ui(){$('#tp').innerHTML=`<label><input type="checkbox" id="all" ${S.sel.size==TOP.length?'checked':''}> <b>Усі теми впереміш</b></label>`+TOP.map(t=>`<label style="display:block"><input type="checkbox" class="tc" value="${t.id}" ${S.sel.has(t.id)?'checked':''}> ${t.t}</label>`).join('');
 $('#all').onchange=e=>{S.sel=new Set(e.target.checked?TOP.map(t=>t.id):[]);S.queue=[];ui()};
 $$('.tc').forEach(c=>c.onchange=()=>{c.checked?S.sel.add(c.value):S.sel.delete(c.value);S.queue=[];$('#all').checked=S.sel.size==TOP.length});
 $('#mP').className=S.mode=='p'?'b':'';$('#mT').className=S.mode=='t'?'b':''}
$('#mP').onclick=()=>{S.mode='p';ui();next()};$('#mT').onclick=()=>{S.mode='t';S.queue=[];ui();next()};
$('#new').onclick=next;ui();next();
</script></body></html>
