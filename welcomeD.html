<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>Банер: звуковий спектр</title>
<style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}canvas{display:block;width:100%;height:100%;cursor:pointer}</style></head>
<body><canvas id="c" title="клік — увімкнути / вимкнути звук"></canvas>
<script>
/* Банер: звуковий спектр.
   Без кліка: беззвучна демонстрація — сума гармонік 1…k (амплітуди 1/h) і її спектр.
   Клік: грає loop.mp3 по колу; кожні SWITCH_SEC секунд по черзі лишаються лише
   EDGE_BANDS нижніх смуг (ФНЧ) або EDGE_BANDS верхніх смуг (ФВЧ). Повторний клік — стоп. */
(function () {
'use strict';

/* ============ НАЛАШТУВАННЯ ============ */
var AUDIO_FILE = 'loop.mp3';
var SWITCH_SEC = 4;       // скільки секунд звучить один режим
var EDGE_BANDS = 6;       // скільки смуг лишається (з 16)
var FIRST_MODE = 'LPF';   // з якого режиму починати: 'LPF' (ФНЧ) або 'HPF' (ФВЧ)
var MASTER_GAIN = 0.5;
var F0 = 6, K_MAX = 6, HARM_T = 2.2;   // демо: основна частота (у бінах), кількість гармонік, секунд на крок

var BANDS = 16, FFT_N = 2048;
var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
var W = 0, H = 0, dpr = 1;

/* ---------- FFT (Кулі—Тьюки, radix-2) і логарифмічні смуги ---------- */
var timeData = new Float32Array(FFT_N);
var re = new Float32Array(FFT_N), im = new Float32Array(FFT_N);
var bandEdges = (function () {
  var lo = 2, hi = FFT_N / 2, e = [];
  for (var b = 0; b <= BANDS; b++) e.push(Math.round(lo * Math.pow(hi / lo, b / BANDS)));
  return e;
})();
var bandVals = new Array(BANDS).fill(0);
var bandMuted = new Array(BANDS).fill(false);

function fftInPlace() {
  var n = re.length;
  for (var i = 1, j = 0; i < n; i++) {
    var bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { var tr = re[i]; re[i] = re[j]; re[j] = tr; var ti = im[i]; im[i] = im[j]; im[j] = ti; }
  }
  for (var len = 2; len <= n; len <<= 1) {
    var ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang), half = len >> 1;
    for (var s = 0; s < n; s += len) {
      var cr = 1, ci = 0;
      for (var k = 0; k < half; k++) {
        var i1 = s + k, i2 = i1 + half;
        var vr = re[i2] * cr - im[i2] * ci, vi = re[i2] * ci + im[i2] * cr;
        re[i2] = re[i1] - vr; im[i2] = im[i1] - vi;
        re[i1] += vr;         im[i1] += vi;
        var ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
}
function bandsFromTimeData() {
  for (var i = 0; i < FFT_N; i++) {
    re[i] = timeData[i] * 0.5 * (1 - Math.cos(2 * Math.PI * i / (FFT_N - 1)));   // вікно Ханна
    im[i] = 0;
  }
  fftInPlace();
  for (var b = 0; b < BANDS; b++) {
    var m = 0;
    for (var k = bandEdges[b]; k < Math.max(bandEdges[b] + 1, bandEdges[b + 1]); k++) {
      var mag = Math.hypot(re[k], im[k]); if (mag > m) m = mag;
    }
    var db = 20 * Math.log10((m + 1e-6) / FFT_N);
    bandVals[b] += (Math.max(0, Math.min(1, (db + 72) / 54)) - bandVals[b]) * 0.4;
  }
}

/* ---------- беззвучне демо: сума гармонік 1…k ---------- */
var idleT0 = performance.now();
var idleK = 1;
function synthIdle(now) {
  var s = ((now - idleT0) / 1000) % (HARM_T * K_MAX);
  idleK = Math.min(K_MAX, Math.floor(s / HARM_T) + 1);
  for (var i = 0; i < FFT_N; i++) {
    var x = 0;
    for (var h = 1; h <= idleK; h++) x += Math.sin(2 * Math.PI * F0 * h * i / FFT_N) / h;
    timeData[i] = x;
  }
  var m = 1e-9;
  for (var j = 0; j < FFT_N; j++) { var a = Math.abs(timeData[j]); if (a > m) m = a; }
  var g = 0.8 / m;
  for (var q = 0; q < FFT_N; q++) timeData[q] *= g;
}

/* ---------- аудіо-граф: loop.mp3 → 16 смугових фільтрів → master → вихід
               (аналізатор стоїть ДО master, тож картинка не залежить від гучності) ---------- */
var actx = null, analyser = null, master = null, bankIn = null, src = null, loopBuf = null;
var bandGains = [];
var running = false, loading = false, errMsg = '';
var mode = FIRST_MODE, modeT0 = 0;

function ensureAudio() {
  if (actx) return true;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { errMsg = 'Web Audio недоступний'; return false; }
  master = actx.createGain(); master.gain.value = MASTER_GAIN;
  analyser = actx.createAnalyser(); analyser.fftSize = FFT_N;
  bankIn = actx.createGain();
  var sumBus = actx.createGain();
  for (var b = 0; b < BANDS; b++) {
    var fLo = Math.max(1, bandEdges[b] * actx.sampleRate / FFT_N);
    var fHi = Math.max(fLo + 1, bandEdges[b + 1] * actx.sampleRate / FFT_N);
    var f = actx.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = Math.sqrt(fLo * fHi);
    f.Q.value = Math.max(0.7, Math.sqrt(fLo * fHi) / (fHi - fLo));
    var g = actx.createGain(); g.gain.value = 1;
    bankIn.connect(f); f.connect(g); g.connect(sumBus);
    bandGains.push(g);
  }
  sumBus.connect(master); master.connect(actx.destination);
  sumBus.connect(analyser);
  return true;
}
function applyBandMutes() {
  if (!actx) return;
  var t = actx.currentTime;
  for (var b = 0; b < BANDS; b++) bandGains[b].gain.setTargetAtTime(bandMuted[b] ? 0 : 1, t, 0.02);
}
function setMode(m) {
  mode = m; modeT0 = performance.now();
  for (var b = 0; b < BANDS; b++) {
    bandMuted[b] = (m === 'HPF') ? (b < BANDS - EDGE_BANDS) : (b >= EDGE_BANDS);
  }
  applyBandMutes();
}
function stopSource() {
  if (src) { try { src.stop(); } catch (e) {} try { src.disconnect(); } catch (e) {} src = null; }
}
function playSource() {
  stopSource();
  src = actx.createBufferSource();
  src.buffer = loopBuf; src.loop = true;
  src.connect(bankIn); src.start();
}
async function startAudio() {
  if (loading) return;
  errMsg = '';
  if (!ensureAudio()) return;
  loading = true;
  try {
    if (actx.state === 'suspended') await actx.resume();   // перший await — всередині жесту кліку
    if (!loopBuf) {
      var resp = await fetch(AUDIO_FILE);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      loopBuf = await actx.decodeAudioData(await resp.arrayBuffer());
    }
    playSource(); setMode(FIRST_MODE); running = true;
  } catch (e) {
    errMsg = (location.protocol === 'file:')
      ? AUDIO_FILE + ' з file:// недоступний — потрібен http-сервер'
      : AUDIO_FILE + ': ' + ((e && e.message) ? e.message : e);
  }
  loading = false;
}
function stopAudio() {
  stopSource(); running = false;
  bandMuted.fill(false); applyBandMutes();
}
canvas.addEventListener('click', function () {
  if (loading) return;
  if (running) stopAudio(); else startAudio();
});

/* ---------- малювання ---------- */
function layout() {
  dpr = window.devicePixelRatio || 1;
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', layout);

var FONT = 'Inter, "Segoe UI", Tahoma, Geneva, Verdana, sans-serif';

function draw(now) {
  var pad = 14, gap = 12, hintH = 22;
  var innerH = H - 2 * pad - hintH;
  var waveH = Math.round(innerH * 0.42), waveW = W - 2 * pad;
  var specY = pad + waveH + gap, specH = H - pad - hintH - specY;

  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

  /* осцилограма */
  ctx.fillStyle = '#f5f6fa'; ctx.fillRect(pad, pad, waveW, waveH);
  ctx.strokeStyle = '#dde0ea'; ctx.lineWidth = 0.5;
  for (var y = 12; y < waveH; y += 12) {
    ctx.beginPath(); ctx.moveTo(pad, pad + y); ctx.lineTo(pad + waveW, pad + y); ctx.stroke();
  }
  var midY = pad + waveH / 2;
  ctx.beginPath(); ctx.strokeStyle = '#3040a0'; ctx.lineWidth = 1.6;
  for (var x = 0; x < waveW; x++) {
    var idx = Math.min(FFT_N - 1, Math.floor(x * FFT_N / waveW / 2) * 1);   // показуємо першу половину буфера — крупніший план
    var yy = midY - timeData[idx] * (waveH / 2) * 0.92;
    if (x === 0) ctx.moveTo(pad + x, yy); else ctx.lineTo(pad + x, yy);
  }
  ctx.stroke();

  /* спектр: BANDS стовпчиків */
  ctx.fillStyle = '#f5f6fa'; ctx.fillRect(pad, specY, waveW, specH);
  var bgap = 4, barW = (waveW - bgap * (BANDS + 1)) / BANDS;
  for (var i = 0; i < BANDS; i++) {
    var bx = pad + bgap + i * (barW + bgap);
    var bh = Math.max(2, bandVals[i] * (specH - 8)), by = specY + specH - 4 - bh;
    if (bandMuted[i]) {
      ctx.fillStyle = 'rgba(148,163,184,0.16)'; ctx.fillRect(bx, specY + 4, barW, specH - 8);   // «вимкнена» смуга
      ctx.fillStyle = 'rgba(148,163,184,0.55)'; ctx.fillRect(bx, by, barW, bh);
    } else {
      var grad = ctx.createLinearGradient(0, by, 0, specY + specH - 4);
      grad.addColorStop(0, 'rgba(120,220,140,0.95)'); grad.addColorStop(1, 'rgba(80,180,100,0.55)');
      ctx.fillStyle = grad; ctx.fillRect(bx, by, barW, bh);
    }
  }

  ctx.textBaseline = 'middle';

  /* плашка режиму + прогрес до перемикання */
  if (running) {
    var isLP = (mode === 'LPF');
    var title = isLP ? 'ФНЧ' : 'ФВЧ';
    var sub = isLP ? 'нижні ' + EDGE_BANDS + ' смуг' : 'верхні ' + EDGE_BANDS + ' смуг';
    ctx.font = '700 17px ' + FONT;
    var tw = ctx.measureText(title).width;
    ctx.font = '12px ' + FONT;
    var sw = ctx.measureText(sub).width;
    var pw = tw + sw + 34, ph = 28, px = pad + waveW - pw - 8, py = pad + 8;
    ctx.fillStyle = 'rgba(255,255,255,0.88)'; ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = '#3040a0'; ctx.lineWidth = 1; ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#3040a0'; ctx.font = '700 17px ' + FONT; ctx.fillText(title, px + 10, py + ph / 2 + 1);
    ctx.fillStyle = '#56627a'; ctx.font = '12px ' + FONT; ctx.fillText(sub, px + 10 + tw + 14, py + ph / 2 + 1);
    var frac = Math.min(1, (now - modeT0) / (SWITCH_SEC * 1000));
    ctx.fillStyle = '#3040a0'; ctx.fillRect(pad, pad + waveH - 3, waveW * frac, 3);
  }

  /* підказка знизу */
  var hint;
  if (loading) hint = 'завантаження…';
  else if (errMsg) hint = errMsg;
  else if (running) hint = AUDIO_FILE + ' · перемикання ФНЧ ⇄ ФВЧ кожні ' + SWITCH_SEC + ' с · клік — зупинити';
  else hint = 'без звуку: сума гармонік 1…' + idleK + ' · клік — увімкнути звук';
  ctx.font = '12px ' + FONT; ctx.textAlign = 'center';
  ctx.fillStyle = errMsg ? '#b3402a' : 'rgba(29,36,51,0.6)';
  ctx.fillText(hint, W / 2, H - pad / 2 - hintH / 2 + 4);
}

function frame() {
  var now = performance.now();
  if (running && actx && analyser) {
    if (now - modeT0 >= SWITCH_SEC * 1000) setMode(mode === 'LPF' ? 'HPF' : 'LPF');
    analyser.getFloatTimeDomainData(timeData);
  } else {
    synthIdle(now);
  }
  bandsFromTimeData();
  draw(now);
  requestAnimationFrame(frame);
}
layout();
frame();
})();
</script></body></html>
