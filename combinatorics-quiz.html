<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квіз: комбінаторика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F3EE;
    --panel: #FFFFFF;
    --panel-border: rgba(20,27,42,0.14);
    --grid: rgba(20,27,42,0.06);
    --ink: #171E2C;
    --dim: #5B6472;
    --gold: #93711A;
    --teal: #0E7C72;
    --good: #1F7A3D;
    --bad: #AE3A2E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A0F1A; --panel: #111827; --panel-border: rgba(255,255,255,0.10);
      --grid: rgba(148,163,184,0.09); --ink: #E7EAF0; --dim: #8B95A8;
      --gold: #D9B84E; --teal: #5FD8CB; --good: #63C783; --bad: #E5766C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A0F1A; --panel: #111827; --panel-border: rgba(255,255,255,0.10);
    --grid: rgba(148,163,184,0.09); --ink: #E7EAF0; --dim: #8B95A8;
    --gold: #D9B84E; --teal: #5FD8CB; --good: #63C783; --bad: #E5766C;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    line-height: 1.5;
    min-height: 100vh;
    padding: 48px 20px 90px;
  }
  .page { max-width: 640px; margin: 0 auto; }

  #stopwatch {
    position: fixed; top: 18px; right: 18px;
    background: var(--panel); border: 1px solid var(--panel-border);
    color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem;
    padding: 8px 12px 10px; opacity: 0.6; z-index: 50;
    transition: opacity 0.15s ease; pointer-events: none; min-width: 96px;
  }
  #stopwatch:hover { opacity: 0.9; }
  #stopwatch .dot { display: inline-block; width: 6px; height: 6px; background: var(--teal); border-radius: 50%; margin-right: 7px; }
  #stopwatch .sw-progress-track { height: 2px; background: var(--panel-border); margin-top: 7px; }
  #stopwatch .sw-progress-fill { height: 100%; background: var(--teal); width: 0%; transition: width 0.25s ease; }

  header { margin-bottom: 40px; }
  .dice { width: 76px; height: 76px; display: block; margin-bottom: 18px; }
  .dice rect { fill: none; stroke: var(--dim); stroke-width: 1.4; }
  .dice circle { fill: var(--gold); }
  .dice .pip-teal { fill: var(--teal); }

  h1 { font-family: 'Spectral', Georgia, serif; font-weight: 700; font-size: 2rem; letter-spacing: -0.01em; margin: 0 0 10px; }
  .subtitle { color: var(--dim); font-size: 0.92rem; max-width: 48ch; margin: 0; }

  #startBtn {
    background: var(--teal); color: var(--bg); border: none;
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 0.9rem;
    padding: 14px 22px; cursor: pointer; margin-top: 30px;
  }
  #startBtn:hover { filter: brightness(1.08); }
  #startBtn:disabled { opacity: 0.5; cursor: default; }
  #quiz.locked { display: none; }

  .q { border-top: 1px solid var(--panel-border); padding: 26px 0; }
  .q:last-of-type { border-bottom: 1px solid var(--panel-border); }
  .q-num { font-size: 0.78rem; color: var(--dim); margin-bottom: 10px; }
  .q-tag { color: var(--gold); }
  .q-prompt { font-family: 'Spectral', Georgia, serif; font-size: 1.1rem; margin: 0 0 16px; max-width: 60ch; }
  .q-prompt b { font-weight: 600; }

  .answer-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .answer-row input[type="text"] {
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--ink);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem; padding: 10px 12px;
    width: 140px; max-width: 100%;
  }
  .answer-row input[type="text"]:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

  .hint-btn {
    background: transparent; border: 1px solid var(--panel-border); color: var(--gold);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; padding: 9px 12px; cursor: pointer;
  }
  .hint-btn:hover { border-color: var(--gold); }
  .hint-btn:disabled { cursor: default; opacity: 0.55; }

  .tag-btn {
    background: transparent; border: 1px solid var(--panel-border); color: var(--teal);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; padding: 9px 12px; cursor: pointer;
  }
  .tag-btn:hover { border-color: var(--teal); }
  .tag-btn:disabled { cursor: default; opacity: 0.55; }

  .hint-text { display: none; margin-top: 12px; font-size: 0.86rem; color: var(--dim); border-left: 2px solid var(--gold); padding-left: 12px; }
  .hint-text.shown { display: block; }

  .tag-text { display: none; margin-top: 12px; font-size: 0.86rem; color: var(--dim); border-left: 2px solid var(--teal); padding-left: 12px; }
  .tag-text.shown { display: block; }

  .actions { margin-top: 46px; display: flex; justify-content: flex-start; }
  #submitBtn, #retryBtn {
    background: var(--teal); color: var(--bg); border: none;
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 0.9rem;
    padding: 14px 22px; cursor: pointer;
  }
  #submitBtn:hover, #retryBtn:hover { filter: brightness(1.08); }

  #results { display: none; }
  .score-block {
    border-top: 1px solid var(--panel-border); border-bottom: 1px solid var(--panel-border);
    padding: 28px 0; margin: 40px 0 30px; display: flex; justify-content: space-between;
    align-items: flex-end; flex-wrap: wrap; gap: 16px;
  }
  .score-num { font-family: 'Spectral', Georgia, serif; font-weight: 700; font-size: 2.6rem; }
  .score-num span { color: var(--dim); font-size: 1.4rem; }
  .time-num { font-family: 'Spectral', Georgia, serif; font-weight: 700; font-size: 1.6rem; text-align: right; }
  .time-lbl, .score-note { color: var(--dim); font-size: 0.8rem; }

  .review { border-top: 1px solid var(--panel-border); padding: 20px 0; }
  .review:last-child { border-bottom: 1px solid var(--panel-border); }
  .review-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 0.78rem; color: var(--dim); }
  .verdict { font-weight: 600; }
  .verdict.correct { color: var(--good); }
  .verdict.wrong { color: var(--bad); }
  .review-prompt { font-family: 'Spectral', Georgia, serif; font-size: 1.02rem; margin: 10px 0 12px; }
  .review-line { font-size: 0.88rem; margin: 4px 0; }
  .review-line .lbl { color: var(--dim); }
  .your-ans.wrong { color: var(--bad); }
  .your-ans.correct { color: var(--good); }
  .review-explain { margin-top: 10px; font-size: 0.86rem; color: var(--dim); padding: 10px 12px; background: var(--panel); border: 1px solid var(--panel-border); }
</style>
</head>
<body>

<div id="stopwatch"><span class="dot"></span><span id="timeDisplay">00:00</span><div class="sw-progress-track"><div class="sw-progress-fill" id="swProgressFill"></div></div></div>

<div class="page">

  <header>
    <svg class="dice" viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="6" width="64" height="64" rx="6"></rect>
      <circle cx="22" cy="22" r="4"></circle>
      <circle cx="54" cy="22" r="4" class="pip-teal"></circle>
      <circle cx="38" cy="38" r="4"></circle>
      <circle cx="22" cy="54" r="4" class="pip-teal"></circle>
      <circle cx="54" cy="54" r="4"></circle>
    </svg>
    <h1>Комбінаторика</h1>
    <p class="subtitle">10 задач: правила суми й добутку, віднімання заборонених варіантів, ділення на дублікати, розміщення, комбінації, перестановки, з повтореннями і без.</p>
    <button id="startBtn">Старт</button>
  </header>

  <div id="quiz" class="locked"></div>

  <div class="actions"><button id="submitBtn">Завершити тест</button></div>

  <div id="results">
    <div class="score-block">
      <div>
        <div class="score-num" id="scoreNum">0<span> / 10</span></div>
        <p class="score-note" id="scoreNote"></p>
      </div>
      <div>
        <div class="time-num" id="finalTime">00:00</div>
        <p class="time-lbl">витрачений час</p>
      </div>
    </div>
    <div id="reviewList"></div>
    <div class="actions"><button id="retryBtn">Пройти ще раз</button></div>
  </div>

</div>

<script>
const questions = [
  {
    tag: "комбінації і правило добутку",
    prompt: "Містобудівник хоче з'єднати вулицю з <b>15 офісами</b> і паралельну вулицю з <b>10 ресторанами</b> двома доріжками: з'єднати 2 офіси на першій вулиці й 1 ресторан на другій. Скільки різних варіантів доріжлк можна прокласти?",
    hint: "Спершу порахуйте, скількома способами обрати 2 офіси з 15, окремо — скількома способами обрати 1 ресторан з 10, а потім ці кількості перемножте (правило добутку).",
    expected: 1050,
    explain: "Кількість способів обрати 2 офіси з 15 — це C(15,2) = 105. Обрати 1 ресторан з 10 — 10 способів. За правилом добутку варіантів буде 105 × 10 = 1050."
  },
  {
    tag: "сума біноміальних коефіцієнтів\ бінарне кодування",
    prompt: "Адмін щодня видає стажеру якийсь <b>непорожній набір прав</b> із <b>6 можливих</b> (читання, запис, деплой, доступ до продакшену, доступ до секретів, доступ до біллінгу) — і жодного разу за весь час стажування набір не повторюється. Скільки днів <b>максимум</b> може тривати таке стажування, поки в адміна не скінчаться унікальні набори прав?",
    hint: "Порахуйте окремо кількість наборів рівно з 1 права, рівно з 2 прав, ..., рівно з 6 прав (це C(6,k) для кожного k від 1 до 6) і просумуйте всі ці кількості — або згадайте, чому сума всіх біноміальних коефіцієнтів C(n,0)+C(n,1)+...+C(n,n) дорівнює 2ⁿ.",
    expected: 63,
    explain: "Кожен набір прав — непорожня підмножина 6-елементної множини. Наборів рівно з k прав: C(6,k), тобто 6, 15, 20, 15, 6, 1 для k=1..6. Сума: 6+15+20+15+6+1 = 63. Коротший шлях: заколувати 1 бітом кожне право. Тоді всього 64 шестибітних комбінацій мінус нульова комбінація. Сума біноміальних коефіцієнтів або усіх підмножин (разом з порожньою) — 2⁶=64, мінус порожній набір (без жодного права — тобто не стажер, а вахтер) — 64−1=63. Отже, стажування може тривати максимум 63 дні."
  },
  {
    tag: "Перестановки + правило ділення",
    prompt: "Кіт поцупив зі столу <b>котлету, сосиску, рибу і шматок сиру</b> і хоче розкласти їх по колу на тарілці. Скільки різних розкладок він міг би отримати?",
    hint: "Спершу порахуйте кількість лінійних перестановок 4 страв, а потім поділіть на кількість способів прокрутити коло (циклічних зсувів).",
    expected: 6,
    explain: "Лінійних перестановок 4 страв: 4! = 24. Кожне колове розташування можна прокрутити 4 способами (циклічні зсуви), тож 24/4 = 6. Дзеркальне відображення тут не враховується, бо тарілку не перевертають."
  },
  {
    tag: "розміщення",
    prompt: "Індіанець хоче розвісити на паркані <b>5 різних скальпів</b> на <b>8 гачках</b> уздовж паркану, по одному скальпу на гачок (3 гачки залишаться порожніми). Скількома способами він може це зробити?",
    hint: "Спершу обираємо гачок для першого скальпа (8 варіантів), потім для другого з решти (7), і так далі для всіх 5 скальпів — це розміщення без повторень.",
    expected: 6720,
    explain: "Розміщення без повторень: 8 × 7 × 6 × 5 × 4 = 6720."
  },
  {
    tag: "розміщення без повторень\ правило віднімання",
    prompt: "Команда з <b>8 піратів</b> обирає капітана, боцмана і кока — три різні посади, один пірат не може займати дві посади одразу. Серед піратів є юнга, який ще замалий, щоб бути капітаном чи боцманом — він годиться лише на посаду кока (або може не отримати жодної посади). Скількома способами можна розподілити три посади?",
    hint: "Розбийте на два випадки: юнга стає коком, або юнга взагалі не отримує посади — і порахуйте кількість розміщень для кожного випадку окремо, а потім додайте результати. Або застосуйте правило віднімання: порахуйте всі варіанти і відніміть варіанти, де юнга стає капітаном чи боцманом",
    expected: 252,
    explain: "Випадок 1 — юнга кок: капітана й боцмана обирають із решти 7 піратів у певному порядку — 7 × 6 = 42 способи. Випадок 2 — юнга без посади: усі три посади розподіляють між рештою 7 піратів — розміщення 7 × 6 × 5 = 210 способів. Разом: 42 + 210 = 252."
  },
  {
    tag: "розміщення з повтореннями\ правило віднімання",
    prompt: "Двері підземелля відкриває заклинання з <b>4 чарівних слів</b>, обраних з набору 6 можливих слів; слова можуть повторюватися в будь-якій позиції. Єдине обмеження: <b>останнім словом не може бути 'кедавра'</b> (немає бажання випадково когось вбити, відмикаючи двері). Скільки різних заклинань існує?",
    hint: "Порахуйте, скільки варіантів для кожної з перших трьох позицій (повторення дозволені), а для останньої позиції — скільки слів залишається дозволеним, і перемножте всі кількості.",
    expected: 1080,
    explain: "Перші 3 слова: 6 варіантів на кожну позицію, тобто 6³ = 216. Останнє слово: дозволено будь-яке з 6, крім 'кедавра', тобто 5 варіантів. Разом: 216 × 5 = 1080."
  },
  {
    tag: "комбінації з повтореннями",
    prompt: "<b>10 мавп</b> ділять між собою <b>5 однакових бананів</b> (усі банани ідентичні, ламати банан не можна — кожен банан дістається цілим одній мавпі, і одна мавпа може отримати і 0, і кілька бананів). Скількома способами можна розподілити банани між мавпами?",
    hint: "Банани однакові, тому важливо лише скільки бананів дісталось кожній мавпі, а не який саме банан — це комбінації з повтореннями (розподіл n однакових предметів між k групами): C(n+k−1, k−1).",
    expected: 2002,
    explain: "Розподіл 5 однакових бананів між 10 мавпами — це комбінації з повтореннями: C(5+10−1, 10−1) = C(14, 9) = C(14, 5) = 2002."
  },
  {
    tag: "підрахунок порівнянь\ прогрессії",
    prompt: "Товстун щодня обирає й з'їдає найбільше тістечко з <b>10 різних за розміром</b> тістечок (щодня йому приносять залишок, і він щоразу порівнює їх і вибирає найбільше заново). Робить він це так: бере перше тістечко в руку, порівнює з другим і залишає в руці більше; потім бере третє, порівнює з тим, що в руці, і залишає більше; і так далі, поки не порівняє всі. Скільки порівнянь він зробить за <b>10 днів</b>?",
    hint: "Порахуйте, скільки порівнянь потрібно за один день, щоб знайти найбільше серед 10 тістечок цим методом. Потім згадайте суму арифметичної прогресії",
    expected: 45,
    explain: "За перший день, щоб знайти максимум серед 10 тістечок цим методом, потрібно 9 порівнянь (перше тістечко порівнянь не потребує, а кожне наступне з 9 інших додає одне порівняння). За другий день він зробить 8 порівнянь і т.д. 9+8+7+..+1=45"
  },
  {
    tag: "принцип Діріхле",
    prompt: "У шухляді безладно лежать шкарпетки трьох кольорів — <b>5 червоних, 4 сині й 3 зелені</b> (усі перемішані). Яку найменшу кількість шкарпеток потрібно витягнути навмання, не дивлячись, щоб гарантовано отримати серед них хоча б дві однакового кольору?",
    hint: "Це принцип Діріхле (метод 'шухляд'): якщо кольорів k, то серед k+1 витягнутих шкарпеток дві обов'язково співпадуть, незалежно від того, скільки всього шкарпеток кожного кольору в шухляді.",
    expected: 4,
    explain: "Кольорів усього 3. У найгіршому випадку перші 3 шкарпетки — усі різного кольору, тож 4-та вже точно утворить пару з однією з попередніх. Відповідь: 4."
  },
  {
    tag: "перестановки з повтореннями",
    prompt: "Дівчина протягом тижня (7 днів) вирішила <b>2 рази одягти сукню, 2 рази брюки і 3 рази спідницю</b>. Скільки різних порядків чергування вбрань на тиждень вона може скласти?",
    hint: "Це перестановки з повтореннями: спершу порахуйте перестановки з семи, а потім поділіть на добуток кількості повторень кожного виду вбрання.",
    expected: 210,
    explain: "Перестановок мультимножини: 7!/(2!·2!·3!) = 5040/(2·2·6) = 5040/24 = 210."
  }
];

const state = questions.map(() => ({ hintUsed: false }));
const quizEl = document.getElementById('quiz');

function render() {
  quizEl.innerHTML = questions.map((q, i) => `
    <div class="q" data-idx="${i}">
      <div class="q-num">Питання ${i+1} з ${questions.length}</div>
      <p class="q-prompt">${q.prompt}</p>
      <div class="answer-row">
        <input type="text" inputmode="numeric" class="ans-input" data-idx="${i}" placeholder="ціле число" autocomplete="off">
        <button class="tag-btn" data-idx="${i}">Показати тему (безкоштовно)</button>
        <button class="hint-btn" data-idx="${i}">Показати підказку (−0.5 бала)</button>
      </div>
      <div class="tag-text" id="tag-${i}"></div>
      <div class="hint-text" id="hint-${i}"></div>
    </div>
  `).join('');

  document.querySelectorAll('.ans-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const idx = Number(inp.dataset.idx);
      updateProgress();
    });
  });

  document.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      const tagEl = document.getElementById('tag-' + idx);
      tagEl.textContent = 'Тема: ' + questions[idx].tag;
      tagEl.classList.add('shown');
      btn.disabled = true;
      btn.textContent = 'Тему показано';
    });
  });

  document.querySelectorAll('.hint-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      if (state[idx].hintUsed) return;
      state[idx].hintUsed = true;
      const hintEl = document.getElementById('hint-' + idx);
      hintEl.textContent = questions[idx].hint;
      hintEl.classList.add('shown');
      btn.disabled = true;
      btn.textContent = 'Підказку використано (−0.5 бала)';
    });
  });

  updateProgress();
}

function updateProgress() {
  const answeredCount = Array.from(document.querySelectorAll('.ans-input')).filter(i => i.value.trim() !== '').length;
  document.getElementById('swProgressFill').style.width = (answeredCount / questions.length * 100) + '%';
}

let startTime = null;
let elapsedFinal = null;
let timerInterval = null;
function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function tickTimer() {
  document.getElementById('timeDisplay').textContent = formatTime(Date.now() - startTime);
}

document.getElementById('startBtn').addEventListener('click', () => {
  startTime = Date.now();
  timerInterval = setInterval(tickTimer, 1000);
  tickTimer();
  document.getElementById('quiz').classList.remove('locked');
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = 'Тест триває…';
});

function fmtPts(p) {
  return Number.isInteger(p) ? String(p) : p.toFixed(1).replace(/0$/, '');
}

function submitQuiz() {
  if (startTime === null) return;
  clearInterval(timerInterval);
  elapsedFinal = Date.now() - startTime;

  let total = 0;
  const reviewHtml = questions.map((q, i) => {
    const input = document.querySelector(`.ans-input[data-idx="${i}"]`);
    const raw = input ? input.value.trim() : '';
    const val = Number(raw);
    const isCorrect = raw !== '' && Number.isInteger(val) && val === q.expected;
    const points = isCorrect ? (state[i].hintUsed ? 0.5 : 1) : 0;
    total += points;

    return `
      <div class="review">
        <div class="review-head">
          <span>Питання ${i+1} · ${q.tag}</span>
          <span class="verdict ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? 'вірно' : 'невірно'} · ${fmtPts(points)} б.</span>
        </div>
        <p class="review-prompt">${q.prompt}</p>
        <p class="review-line"><span class="lbl">Ваша відповідь: </span><span class="your-ans ${isCorrect ? 'correct' : 'wrong'}">${raw === '' ? '— не введено —' : raw}</span></p>
        <p class="review-line"><span class="lbl">Правильна відповідь: </span>${q.expected}</p>
        <div class="review-explain">${q.explain}</div>
      </div>
    `;
  }).join('');

  document.getElementById('reviewList').innerHTML = reviewHtml;
  document.getElementById('scoreNum').innerHTML = `${fmtPts(total)}<span> / ${questions.length}</span>`;

  const hintsUsed = state.filter(s => s.hintUsed).length;
  document.getElementById('scoreNote').textContent = hintsUsed > 0
    ? `Використано підказок: ${hintsUsed} (кожна знімає 0.5 бала з відповідної правильної відповіді).`
    : `Підказки не використовувались.`;

  document.getElementById('finalTime').textContent = formatTime(elapsedFinal);

  document.getElementById('quiz').style.display = 'none';
  document.querySelector('.actions').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('submitBtn').addEventListener('click', submitQuiz);
document.getElementById('retryBtn').addEventListener('click', () => location.reload());

render();
</script>
</body>
</html>
