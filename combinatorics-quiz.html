<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квіз: комбінаторика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F3EE;
    --panel: #FFFFFF;
    --panel-border: rgba(20,27,42,0.14);
    --grid: rgba(20,27,42,0.06);
    --ink: #171E2C;
    --dim: #5B6472;
    --gold: #93711A;
    --teal: #0E7C72;
    --good: #1F7A3D;
    --bad: #AE3A2E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A0F1A; --panel: #111827; --panel-border: rgba(255,255,255,0.10);
      --grid: rgba(148,163,184,0.09); --ink: #E7EAF0; --dim: #8B95A8;
      --gold: #D9B84E; --teal: #5FD8CB; --good: #63C783; --bad: #E5766C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A0F1A; --panel: #111827; --panel-border: rgba(255,255,255,0.10);
    --grid: rgba(148,163,184,0.09); --ink: #E7EAF0; --dim: #8B95A8;
    --gold: #D9B84E; --teal: #5FD8CB; --good: #63C783; --bad: #E5766C;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    line-height: 1.5;
    min-height: 100vh;
    padding: 48px 20px 90px;
  }
  .page { max-width: 640px; margin: 0 auto; }

  #stopwatch {
    position: fixed; top: 18px; right: 18px;
    background: var(--panel); border: 1px solid var(--panel-border);
    color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem;
    padding: 8px 12px 10px; opacity: 0.6; z-index: 50;
    transition: opacity 0.15s ease; pointer-events: none; min-width: 96px;
  }
  #stopwatch:hover { opacity: 0.9; }
  #stopwatch .dot { display: inline-block; width: 6px; height: 6px; background: var(--teal); border-radius: 50%; margin-right: 7px; }
  #stopwatch .sw-progress-track { height: 2px; background: var(--panel-border); margin-top: 7px; }
  #stopwatch .sw-progress-fill { height: 100%; background: var(--teal); width: 0%; transition: width 0.25s ease; }

  header { margin-bottom: 40px; }
  .dice { width: 76px; height: 76px; display: block; margin-bottom: 18px; }
  .dice rect { fill: none; stroke: var(--dim); stroke-width: 1.4; }
  .dice circle { fill: var(--gold); }
  .dice .pip-teal { fill: var(--teal); }

  h1 { font-family: 'Spectral', Georgia, serif; font-weight: 700; font-size: 2rem; letter-spacing: -0.01em; margin: 0 0 10px; }
  .subtitle { color: var(--dim); font-size: 0.92rem; max-width: 48ch; margin: 0; }

  #startBtn {
    background: var(--teal); color: var(--bg); border: none;
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 0.9rem;
    padding: 14px 22px; cursor: pointer; margin-top: 30px;
  }
  #startBtn:hover { filter: brightness(1.08); }
  #startBtn:disabled { opacity: 0.5; cursor: default; }
  #quiz.locked { display: none; }

  .q { border-top: 1px solid var(--panel-border); padding: 26px 0; }
  .q:last-of-type { border-bottom: 1px solid var(--panel-border); }
  .q-num { font-size: 0.78rem; color: var(--dim); margin-bottom: 10px; }
  .q-tag { color: var(--gold); }
  .q-prompt { font-family: 'Spectral', Georgia, serif; font-size: 1.1rem; margin: 0 0 16px; max-width: 60ch; }
  .q-prompt b { font-weight: 600; }

  .answer-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .answer-row input[type="text"] {
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--ink);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem; padding: 10px 12px;
    width: 140px; max-width: 100%;
  }
  .answer-row input[type="text"]:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

  .hint-btn {
    background: transparent; border: 1px solid var(--panel-border); color: var(--gold);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; padding: 9px 12px; cursor: pointer;
  }
  .hint-btn:hover { border-color: var(--gold); }
  .hint-btn:disabled { cursor: default; opacity: 0.55; }

  .tag-btn {
    background: transparent; border: 1px solid var(--panel-border); color: var(--teal);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; padding: 9px 12px; cursor: pointer;
  }
  .tag-btn:hover { border-color: var(--teal); }
  .tag-btn:disabled { cursor: default; opacity: 0.55; }

  .hint-text { display: none; margin-top: 12px; font-size: 0.86rem; color: var(--dim); border-left: 2px solid var(--gold); padding-left: 12px; }
  .hint-text.shown { display: block; }

  .tag-text { display: none; margin-top: 12px; font-size: 0.86rem; color: var(--dim); border-left: 2px solid var(--teal); padding-left: 12px; }
  .tag-text.shown { display: block; }

  .actions { margin-top: 46px; display: flex; justify-content: flex-start; }
  #submitBtn, #retryBtn {
    background: var(--teal); color: var(--bg); border: none;
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 0.9rem;
    padding: 14px 22px; cursor: pointer;
  }
  #submitBtn:hover, #retryBtn:hover { filter: brightness(1.08); }

  #results { display: none; }
  .score-block {
    border-top: 1px solid var(--panel-border); border-bottom: 1px solid var(--panel-border);
    padding: 28px 0; margin: 40px 0 30px; display: flex; justify-content: space-between;
    align-items: flex-end; flex-wrap: wrap; gap: 16px;
  }
  .score-num { font-family: 'Spectral', Georgia, serif; font-weight: 700; font-size: 2.6rem; }
  .score-num span { color: var(--dim); font-size: 1.4rem; }
  .time-num { font-family: 'Spectral', Georgia, serif; font-weight: 700; font-size: 1.6rem; text-align: right; }
  .time-lbl, .score-note { color: var(--dim); font-size: 0.8rem; }

  .review { border-top: 1px solid var(--panel-border); padding: 20px 0; }
  .review:last-child { border-bottom: 1px solid var(--panel-border); }
  .review-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 0.78rem; color: var(--dim); }
  .verdict { font-weight: 600; }
  .verdict.correct { color: var(--good); }
  .verdict.wrong { color: var(--bad); }
  .review-prompt { font-family: 'Spectral', Georgia, serif; font-size: 1.02rem; margin: 10px 0 12px; }
  .review-line { font-size: 0.88rem; margin: 4px 0; }
  .review-line .lbl { color: var(--dim); }
  .your-ans.wrong { color: var(--bad); }
  .your-ans.correct { color: var(--good); }
  .review-explain { margin-top: 10px; font-size: 0.86rem; color: var(--dim); padding: 10px 12px; background: var(--panel); border: 1px solid var(--panel-border); }
</style>
</head>
<body>

<div id="stopwatch"><span class="dot"></span><span id="timeDisplay">00:00</span><div class="sw-progress-track"><div class="sw-progress-fill" id="swProgressFill"></div></div></div>

<div class="page">

  <header>
    <svg class="dice" viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="6" width="64" height="64" rx="6"></rect>
      <circle cx="22" cy="22" r="4"></circle>
      <circle cx="54" cy="22" r="4" class="pip-teal"></circle>
      <circle cx="38" cy="38" r="4"></circle>
      <circle cx="22" cy="54" r="4" class="pip-teal"></circle>
      <circle cx="54" cy="54" r="4"></circle>
    </svg>
    <h1>Комбінаторика</h1>
    <p class="subtitle">10 задач: правила суми й добутку, віднімання заборонених варіантів, ділення на дублікати, розміщення, комбінації, перестановки, з повтореннями і без. Числа в умовах генеруються випадково — кожна спроба відрізняється.</p>
    <button id="startBtn">Старт</button>
  </header>

  <div id="quiz" class="locked"></div>

  <div class="actions"><button id="submitBtn">Завершити тест</button></div>

  <div id="results">
    <div class="score-block">
      <div>
        <div class="score-num" id="scoreNum">0<span> / 10</span></div>
        <p class="score-note" id="scoreNote"></p>
      </div>
      <div>
        <div class="time-num" id="finalTime">00:00</div>
        <p class="time-lbl">витрачений час</p>
      </div>
    </div>
    <div id="reviewList"></div>
    <div class="actions"><button id="retryBtn">Пройти ще раз</button></div>
  </div>

</div>

<script>
// ===== ГЕНЕРАТОРИ ЗАДАЧ (числа випадкові в розумних межах) =====
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// українська відміна після числівника: 1 / 2–4 / 5+
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
const fact = n => (n <= 1 ? 1 : n * fact(n - 1));
const comb = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); };
const joinList = arr => arr.length === 1 ? arr[0] : arr.slice(0, -1).join(', ') + ' і ' + arr[arr.length - 1];

// 1. Комбінації + правило добутку: C(a,2)·b
function genOffices() {
  const a = rnd(8, 20), b = rnd(5, 15);
  const c2 = comb(a, 2);
  return {
    tag: "комбінації і правило добутку",
    prompt: `Містобудівник хоче з'єднати вулицю з <b>${a} офісами</b> і паралельну вулицю з <b>${b} ресторанами</b> двома доріжками: з'єднати 2 офіси на першій вулиці й 1 ресторан на другій. Скільки різних варіантів доріжок можна прокласти?`,
    hint: `Спершу порахуйте, скількома способами обрати 2 офіси з ${a}, окремо — скількома способами обрати 1 ресторан з ${b}, а потім ці кількості перемножте (правило добутку).`,
    expected: c2 * b,
    explain: `Кількість способів обрати 2 офіси з ${a} — це C(${a},2) = ${a}·${a - 1}/2 = ${c2}. Обрати 1 ресторан з ${b} — ${b} способів. За правилом добутку варіантів буде ${c2} × ${b} = ${c2 * b}.`,
    params: { a, b }
  };
}

// 2. Непорожні підмножини: 2^n − 1
const RIGHTS = ['читання', 'запис', 'деплой', 'доступ до продакшену', 'доступ до секретів', 'доступ до біллінгу', 'доступ до логів', 'видалення ресурсів'];
function genRights() {
  const n = rnd(4, 8);
  const rights = shuffle(RIGHTS).slice(0, n);
  const row = []; for (let k = 1; k <= n; k++) row.push(comb(n, k));
  const total = Math.pow(2, n), ans = total - 1;
  return {
    tag: "сума біноміальних коефіцієнтів / бінарне кодування",
    prompt: `Адмін щодня видає стажеру якийсь <b>непорожній набір прав</b> із <b>${n} можливих</b> (${rights.join(', ')}) — і жодного разу за весь час стажування набір не повторюється. Скільки днів <b>максимум</b> може тривати таке стажування, поки в адміна не скінчаться унікальні набори прав?`,
    hint: `Порахуйте окремо кількість наборів рівно з 1 права, рівно з 2 прав, ..., рівно з ${n} прав (це C(${n},k) для кожного k від 1 до ${n}) і просумуйте всі ці кількості — або згадайте, чому сума всіх біноміальних коефіцієнтів C(n,0)+C(n,1)+...+C(n,n) дорівнює 2ⁿ.`,
    expected: ans,
    explain: `Кожен набір прав — непорожня підмножина ${n}-елементної множини. Наборів рівно з k прав: C(${n},k), тобто ${row.join(', ')} для k=1..${n}. Сума: ${row.join('+')} = ${ans}. Коротший шлях: кожне право — це один біт (є / немає), тож усього 2<sup>${n}</sup> = ${total} комбінацій разом з порожньою. Мінус порожній набір (без жодного права — це вже не стажер, а вахтер): ${total}−1 = ${ans}. Отже, стажування може тривати максимум ${ans} ${plural(ans, 'день', 'дні', 'днів')}.`,
    params: { n }
  };
}

// 3. Кругові перестановки: (n−1)!
const DISHES = ['котлету', 'сосиску', 'рибу', 'шматок сиру', 'ковбасу', 'пиріжок', 'курячу ніжку'];
function genCat() {
  const n = rnd(4, 7);
  const dishes = shuffle(DISHES).slice(0, n);
  return {
    tag: "Перестановки + правило ділення",
    prompt: `Кіт поцупив зі столу <b>${joinList(dishes)}</b> і хоче розкласти їх по колу на тарілці. Скільки різних розкладок він міг би отримати?`,
    hint: `Спершу порахуйте кількість лінійних перестановок ${n} страв, а потім поділіть на кількість способів прокрутити коло (циклічних зсувів).`,
    expected: fact(n - 1),
    explain: `Лінійних перестановок ${n} страв: ${n}! = ${fact(n)}. Кожне колове розташування можна прокрутити ${n} способами (циклічні зсуви), тож ${fact(n)}/${n} = ${fact(n - 1)}. Дзеркальне відображення тут не враховується, бо тарілку не перевертають.`,
    params: { n }
  };
}

// 4. Розміщення без повторень: n!/(n−k)!
function genScalps() {
  const k = rnd(3, 6), n = rnd(k + 2, 10);
  const factors = Array.from({ length: k }, (_, i) => n - i);
  const ans = factors.reduce((p, x) => p * x, 1);
  const empty = n - k;
  return {
    tag: "розміщення",
    prompt: `Індіанець хоче розвісити на паркані <b>${k} ${plural(k, 'різний скальп', 'різні скальпи', 'різних скальпів')}</b> на <b>${n} гачках</b> уздовж паркану, по одному скальпу на гачок (${empty} ${plural(empty, 'гачок', 'гачки', 'гачків')} залишаться порожніми). Порядок гачків важливий. Скількома способами він може це зробити?`,
    hint: `Спершу обираємо гачок для першого скальпа (${n} варіантів), потім для другого з решти (${n - 1}), і так далі для всіх ${k} скальпів — це розміщення без повторень.`,
    expected: ans,
    explain: `Розміщення без повторень: ${factors.join(' × ')} = ${ans}.`,
    params: { n, k }
  };
}

// 5. Пірати: (n−1)(n−2) + (n−1)(n−2)(n−3)
function genPirates() {
  const n = rnd(6, 12);
  const c1 = (n - 1) * (n - 2), c2 = (n - 1) * (n - 2) * (n - 3);
  const total = n * (n - 1) * (n - 2);
  return {
    tag: "розміщення без повторень / правило віднімання",
    prompt: `Команда з <b>${n} піратів</b> обирає капітана, боцмана і кока — три різні посади, один пірат не може займати дві посади одразу. Серед піратів є юнга, який ще замалий, щоб бути капітаном чи боцманом — він годиться лише на посаду кока (або може не отримати жодної посади). Скількома способами можна розподілити три посади?`,
    hint: `Розбийте на два випадки: юнга стає коком, або юнга взагалі не отримує посади — і порахуйте кількість розміщень для кожного випадку окремо, а потім додайте результати. Або застосуйте правило віднімання: порахуйте всі варіанти і відніміть варіанти, де юнга стає капітаном чи боцманом`,
    expected: c1 + c2,
    explain: `Випадок 1 — юнга кок: капітана й боцмана обирають із решти ${n - 1} піратів у певному порядку — ${n - 1} × ${n - 2} = ${c1} ${plural(c1, 'спосіб', 'способи', 'способів')}. Випадок 2 — юнга без посади: усі три посади розподіляють між рештою ${n - 1} піратів — розміщення ${n - 1} × ${n - 2} × ${n - 3} = ${c2} ${plural(c2, 'спосіб', 'способи', 'способів')}. Разом: ${c1} + ${c2} = ${c1 + c2}. Перевірка відніманням: усіх розподілів ${n}×${n - 1}×${n - 2} = ${total}, з них юнга-капітан — ${c1}, юнга-боцман — ${c1}, тож ${total} − 2·${c1} = ${total - 2 * c1}.`,
    params: { n }
  };
}

// 6. Розміщення з повтореннями + обмеження: N^(L−1)·(N−1)
function genSpell() {
  const L = rnd(3, 5), N = rnd(4, 8);
  const pre = Math.pow(N, L - 1), ans = pre * (N - 1);
  return {
    tag: "розміщення з повтореннями / правило віднімання",
    prompt: `Двері підземелля відкриває заклинання з <b>${L} чарівних слів</b>, обраних з набору з <b>${N} можливих слів</b>; слова можуть повторюватися в будь-якій позиції. Єдине обмеження: <b>останнім словом не може бути 'кедавра'</b> (немає бажання випадково когось вбити, відмикаючи двері). Скільки різних заклинань існує?`,
    hint: `Порахуйте, скільки варіантів для кожної з перших ${L - 1} позицій (повторення дозволені), а для останньої позиції — скільки слів залишається дозволеним, і перемножте всі кількості.`,
    expected: ans,
    explain: `Перші ${L - 1} ${plural(L - 1, 'слово', 'слова', 'слів')}: ${N} варіантів на кожну позицію, тобто ${N}<sup>${L - 1}</sup> = ${pre}. Останнє слово: дозволено будь-яке з ${N}, крім 'кедавра', тобто ${N - 1} ${plural(N - 1, 'варіант', 'варіанти', 'варіантів')}. Разом: ${pre} × ${N - 1} = ${ans}.`,
    params: { L, N }
  };
}

// 7. Комбінації з повтореннями: C(b+m−1, b)
function genMonkeys() {
  const b = rnd(3, 7), m = rnd(4, 10);
  const ans = comb(b + m - 1, b);
  return {
    tag: "комбінації з повтореннями",
    prompt: `<b>${m} ${plural(m, 'мавпа', 'мавпи', 'мавп')}</b> ділять між собою <b>${b} ${plural(b, 'однаковий банан', 'однакові банани', 'однакових бананів')}</b> (усі банани ідентичні, ламати банан не можна — кожен банан дістається цілим одній мавпі, і одна мавпа може отримати і 0, і кілька бананів). Скількома способами можна розподілити банани між мавпами?`,
    hint: `Банани однакові, тому важливо лише скільки бананів дісталось кожній мавпі, а не який саме банан — це комбінації з повтореннями (розподіл n однакових предметів між k групами): C(n+k−1, k−1).`,
    expected: ans,
    explain: `Розподіл ${b} однакових бананів між ${m} мавпами — це комбінації з повтореннями: C(${b}+${m}−1, ${m}−1) = C(${b + m - 1}, ${m - 1}) = C(${b + m - 1}, ${b}) = ${ans}.`,
    params: { b, m }
  };
}

// 8. Арифметична прогресія: d(2n−d−1)/2
function genFatman() {
  const n = rnd(6, 14), d = rnd(3, n);
  const ans = d * (2 * n - d - 1) / 2;
  const terms = Array.from({ length: d }, (_, i) => n - 1 - i);
  const termStr = terms.length <= 5 ? terms.join(' + ') : `${terms[0]} + ${terms[1]} + … + ${terms[d - 1]}`;
  return {
    tag: "підрахунок порівнянь / прогресії",
    prompt: `Товстун щодня обирає й з'їдає найбільше тістечко з <b>${n} різних за розміром</b> тістечок (щодня йому приносять залишок, і він щоразу порівнює їх і вибирає найбільше заново). Робить він це так: бере перше тістечко в руку, порівнює з другим і залишає в руці більше; потім бере третє, порівнює з тим, що в руці, і залишає більше; і так далі, поки не порівняє всі. Скільки порівнянь він зробить за <b>${d} ${plural(d, 'день', 'дні', 'днів')}</b>?`,
    hint: `Порахуйте, скільки порівнянь потрібно за один день, щоб знайти найбільше серед ${n} тістечок цим методом (щодня тістечок стає на одне менше). Потім згадайте суму арифметичної прогресії`,
    expected: ans,
    explain: `За перший день, щоб знайти максимум серед ${n} тістечок цим методом, потрібно ${n - 1} порівнянь (перше тістечко порівнянь не потребує, а кожне наступне з ${n - 1} інших додає одне порівняння). За другий день тістечок уже ${n - 1}, тож ${n - 2} порівнянь, і т.д. За ${d}-й день — ${n - d}. Разом: ${termStr} = (${n - 1} + ${n - d})·${d}/2 = ${ans}.`,
    params: { n, d }
  };
}

// 9. Принцип Діріхле: k+1
const SOCKS = [
  { few: 'червоні', many: 'червоних' }, { few: 'сині', many: 'синіх' }, { few: 'зелені', many: 'зелених' },
  { few: 'жовті', many: 'жовтих' }, { few: 'чорні', many: 'чорних' }, { few: 'білі', many: 'білих' }
];
function genSocks() {
  const k = rnd(3, 5);
  const kinds = shuffle(SOCKS).slice(0, k);
  const counts = kinds.map(() => rnd(2, 7));
  const phrases = kinds.map((c, i) => `${counts[i]} ${counts[i] < 5 ? c.few : c.many}`);
  const kWord = { 3: 'трьох', 4: 'чотирьох', 5: "п'яти" }[k];
  return {
    tag: "принцип Діріхле",
    prompt: `У шухляді безладно лежать шкарпетки ${kWord} кольорів — <b>${joinList(phrases)}</b> (усі перемішані). Яку найменшу кількість шкарпеток потрібно витягнути навмання, не дивлячись, щоб гарантовано отримати серед них хоча б дві однакового кольору?`,
    hint: `Це принцип Діріхле (метод 'шухляд'): якщо кольорів k, то серед k+1 витягнутих шкарпеток дві обов'язково співпадуть, незалежно від того, скільки всього шкарпеток кожного кольору в шухляді.`,
    expected: k + 1,
    explain: `Кольорів усього ${k}. У найгіршому випадку перші ${k} шкарпеток — усі різного кольору, тож ${k + 1}-ша вже точно утворить пару з однією з попередніх. Відповідь: ${k + 1}.`,
    params: { k, counts }
  };
}

// 10. Перестановки мультимножини: n!/(a!·b!·c!)
function genOutfits() {
  const n = rnd(6, 9);
  let a, b, c;
  do { a = rnd(1, 5); b = rnd(1, 5); c = n - a - b; } while (c < 1 || c > 5);
  const [x, y, z] = shuffle([a, b, c]);
  const den = fact(x) * fact(y) * fact(z), ans = fact(n) / den;
  const times = t => `${t} ${plural(t, 'раз', 'рази', 'разів')}`;
  return {
    tag: "перестановки з повтореннями",
    prompt: `Дівчина протягом <b>${n} ${plural(n, 'день', 'дні', 'днів')}</b> вирішила <b>${times(x)} одягти сукню, ${times(y)} брюки і ${times(z)} спідницю</b>. Скільки різних порядків чергування вбрань вона може скласти?`,
    hint: `Це перестановки з повтореннями: спершу порахуйте перестановки з ${n}, а потім поділіть на добуток кількості повторень кожного виду вбрання.`,
    expected: ans,
    explain: `Перестановок мультимножини: ${n}!/(${x}!·${y}!·${z}!) = ${fact(n)}/(${[x, y, z].map(fact).join('·')}) = ${fact(n)}/${den} = ${ans}.`,
    params: { n, counts: [x, y, z] }
  };
}

const questions = [
  genOffices(), genRights(), genCat(), genScalps(), genPirates(),
  genSpell(), genMonkeys(), genFatman(), genSocks(), genOutfits()
];

const state = questions.map(() => ({ hintUsed: false }));
const quizEl = document.getElementById('quiz');

function render() {
  quizEl.innerHTML = questions.map((q, i) => `
    <div class="q" data-idx="${i}">
      <div class="q-num">Питання ${i+1} з ${questions.length}</div>
      <p class="q-prompt">${q.prompt}</p>
      <div class="answer-row">
        <input type="text" inputmode="numeric" class="ans-input" data-idx="${i}" placeholder="ціле число" autocomplete="off">
        <button class="tag-btn" data-idx="${i}">Показати тему (безкоштовно)</button>
        <button class="hint-btn" data-idx="${i}">Показати підказку (−0.5 бала)</button>
      </div>
      <div class="tag-text" id="tag-${i}"></div>
      <div class="hint-text" id="hint-${i}"></div>
    </div>
  `).join('');

  document.querySelectorAll('.ans-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const idx = Number(inp.dataset.idx);
      updateProgress();
    });
  });

  document.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      const tagEl = document.getElementById('tag-' + idx);
      tagEl.textContent = 'Тема: ' + questions[idx].tag;
      tagEl.classList.add('shown');
      btn.disabled = true;
      btn.textContent = 'Тему показано';
    });
  });

  document.querySelectorAll('.hint-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      if (state[idx].hintUsed) return;
      state[idx].hintUsed = true;
      const hintEl = document.getElementById('hint-' + idx);
      hintEl.textContent = questions[idx].hint;
      hintEl.classList.add('shown');
      btn.disabled = true;
      btn.textContent = 'Підказку використано (−0.5 бала)';
    });
  });

  updateProgress();
}

function updateProgress() {
  const answeredCount = Array.from(document.querySelectorAll('.ans-input')).filter(i => i.value.trim() !== '').length;
  document.getElementById('swProgressFill').style.width = (answeredCount / questions.length * 100) + '%';
}

let startTime = null;
let elapsedFinal = null;
let timerInterval = null;
function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function tickTimer() {
  document.getElementById('timeDisplay').textContent = formatTime(Date.now() - startTime);
}

document.getElementById('startBtn').addEventListener('click', () => {
  startTime = Date.now();
  timerInterval = setInterval(tickTimer, 1000);
  tickTimer();
  document.getElementById('quiz').classList.remove('locked');
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = 'Тест триває…';
});

function fmtPts(p) {
  return Number.isInteger(p) ? String(p) : p.toFixed(1).replace(/0$/, '');
}

function submitQuiz() {
  if (startTime === null) return;
  clearInterval(timerInterval);
  elapsedFinal = Date.now() - startTime;

  let total = 0;
  const reviewHtml = questions.map((q, i) => {
    const input = document.querySelector(`.ans-input[data-idx="${i}"]`);
    const raw = input ? input.value.trim() : '';
    const val = Number(raw);
    const isCorrect = raw !== '' && Number.isInteger(val) && val === q.expected;
    const points = isCorrect ? (state[i].hintUsed ? 0.5 : 1) : 0;
    total += points;

    return `
      <div class="review">
        <div class="review-head">
          <span>Питання ${i+1} · ${q.tag}</span>
          <span class="verdict ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? 'вірно' : 'невірно'} · ${fmtPts(points)} б.</span>
        </div>
        <p class="review-prompt">${q.prompt}</p>
        <p class="review-line"><span class="lbl">Ваша відповідь: </span><span class="your-ans ${isCorrect ? 'correct' : 'wrong'}">${raw === '' ? '— не введено —' : raw}</span></p>
        <p class="review-line"><span class="lbl">Правильна відповідь: </span>${q.expected}</p>
        <div class="review-explain">${q.explain}</div>
      </div>
    `;
  }).join('');

  document.getElementById('reviewList').innerHTML = reviewHtml;
  document.getElementById('scoreNum').innerHTML = `${fmtPts(total)}<span> / ${questions.length}</span>`;

  const hintsUsed = state.filter(s => s.hintUsed).length;
  document.getElementById('scoreNote').textContent = hintsUsed > 0
    ? `Використано підказок: ${hintsUsed} (кожна знімає 0.5 бала з відповідної правильної відповіді).`
    : `Підказки не використовувались.`;

  document.getElementById('finalTime').textContent = formatTime(elapsedFinal);

  document.getElementById('quiz').style.display = 'none';
  document.querySelector('.actions').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('submitBtn').addEventListener('click', submitQuiz);
document.getElementById('retryBtn').addEventListener('click', () => location.reload());

render();
</script>
</body>
</html>
