function gen1(){const k=ri(0,12);

 const pr=imp.filter(a=>!imp.some(b=>b.s!=a.s&&(a.s&b.s)==a.s));let bc=1e9,covers=[];

 (function rec(i,ch,u,l){const c=l*100+ch.length;if(c>bc)return;if(u==Tm){if(c<bc){bc=c;covers=[ch]}else covers.push(ch);return}
  if(i>=pr.length)return;rec(i+1,[...ch,pr[i].s],u|pr[i].s,l+pr[i].l);rec(i+1,ch,u,l)})(0,[],0,0);

/* знак «·» можна пропускати (як множення в арифметиці): між сусідніми літерою/дужкою вставляємо його автоматично; ∧ старша за ∨ */

<div class="k1"><div class="k1l"><h3>1. Таблиця істинності</h3><p class="hint">Натискайте клітинку F, щоб змінити значення.</p><div id="tbl"></div></div>
